server {
    listen 80;
    listen [::]:80;
    server_name choripan3.ing.uc.cl;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name choripan3.ing.uc.cl;

    server_tokens off;
    client_max_body_size 1m;

    # Certificate created with `certbot --nginx`.
    ssl_certificate /etc/letsencrypt/live/choripan3.ing.uc.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/choripan3.ing.uc.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend build published by the farmacentral-frontend-g3 workflow.
    root /var/www/farmacentral-frontend/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(docs|docs/oauth2-redirect|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite adds a content hash to every file name in /assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes (/carro, /trazabilidad/LOT-1, /payment-result...) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
