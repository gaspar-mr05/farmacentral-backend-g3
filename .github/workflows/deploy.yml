name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check code quality
        run: |
          ruff check app scripts tests
          ruff format --check app scripts tests

      - name: Run isolated E3 regression suite
        run: python -m scripts.test_e3

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' 'choripan3.ing.uc.cl ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfaqDL752QpAVPqyq464LDB6CqSv1HM927P834FKqvD' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy current main branch
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes integracion@choripan3.ing.uc.cl \
            'cd /home/integracion/farmacentral-backend && git pull --ff-only origin main && ./deploy/release.sh'
